name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-buildvcs=false"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X causeway/internal/tunnel.Version=${VERSION}"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o dist/relay-linux-amd64 ./cmd/relay
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/agent-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/agent-linux-arm64 ./cmd/agent

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
